name: CI

on:
  push:
    branches: [master, embed-chroot-containment]
  pull_request:
    branches: [master, embed-chroot-containment]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
        kernel: [ish, linux]
    steps:
      - uses: actions/checkout@v2
        with:
            submodules: true
      - uses: actions/setup-python@v2
        with:
            python-version: '3.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libarchive-dev
          pip3 install meson ninja
      - name: Clone Linux
        if: matrix.kernel == 'linux'
        run: deps/clone-linux.sh
      - name: Build
        run: |
          meson build -Dengine=asbestos -Dkernel=${{matrix.kernel}}
          ninja -C build
        env:
          CC: ${{matrix.cc}}
      - name: Test
        if: matrix.kernel == 'ish'
        timeout-minutes: 10
        run: meson test -C build --no-rebuild --print-errorlogs dirty-page-trace float80 uname internal-signal-mask task-lifetime
      - name: End-to-end test
        if: matrix.kernel == 'ish'
        timeout-minutes: 20
        run: meson test -C build --no-rebuild --print-errorlogs --timeout-multiplier 6 e2e

  build-mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        kernel: [ish, linux]
    steps:
      - uses: actions/checkout@v2
        with:
            submodules: true
      - name: Install dependencies
        run: |
          brew install llvm lld ninja libarchive meson
      - name: Clone Linux
        if: matrix.kernel == 'linux'
        run: deps/clone-linux.sh
      - name: Build
        if: matrix.kernel == 'ish'
        run: xcodebuild -project iSH.xcodeproj -scheme iSH -arch arm64 -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      - name: Test ARM64 emulator regressions
        if: matrix.kernel == 'ish'
        run: |
          meson setup build-arm64-ci -Dguest_arch=arm64 -Dkernel=ish -Dengine=asbestos
          meson compile -C build-arm64-ci arm64-neon-reverse-test dirty-page-chain-test uname-test internal-signal-mask-test
          meson test -C build-arm64-ci --no-rebuild --print-errorlogs arm64-neon-reverse dirty-page-chain uname internal-signal-mask
      - name: Build
        if: matrix.kernel == 'linux'
        run: xcodebuild -project iSH.xcodeproj -scheme iSH+Linux -arch x86_64 -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
